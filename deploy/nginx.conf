server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /var/www/chungus;
    index index.html;
    client_max_body_size 32k;

    # Angular resuelve las rutas de la aplicación, incluida su pantalla 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
    # Nginx recibe /api y reenvía las peticiones a JSON Server, que escucha solo localmente.
    location = /api/catalogo {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:3000/catalogo;
    }
    location ~ ^/api/cotizaciones(/[0-9]+)?$ {
        limit_except GET POST PATCH DELETE { deny all; }
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:3000;
    }
    location /api/ { return 404; }
}
